name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # lint 工具链（@purea/eslint-config → @antfu/eslint-config）依赖 Object.groupBy（Node 21+），
      # 故最小测试版本为 22；engines >=18 为运行时契约（构建产物 target node18）
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:check

      - name: Test
        run: pnpm run test

      - name: Coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Package lint (publint)
        run: pnpm run publint

      - name: Types check (arethetypeswrong)
        run: pnpm run attw
